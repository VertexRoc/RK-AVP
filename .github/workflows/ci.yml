name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install quality tools
        run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy cmake ninja-build libyaml-cpp-dev
      - name: Check formatting
        run: |
          mapfile -t files < <(find include src tools examples tests -type f \( -name '*.hpp' -o -name '*.cpp' \) -print)
          clang-format --dry-run --Werror "${files[@]}"
      - name: Configure compile database
        run: cmake -S . -B build/tidy -G Ninja -DCMAKE_BUILD_TYPE=Debug -DRKAVP_FETCH_DEPS=OFF -DRKAVP_BUILD_TESTS=OFF
      - name: Run clang-tidy on core runtime
        run: |
          find src/core -name '*.cpp' -print0 | xargs -0 -n1 clang-tidy -p build/tidy

  host:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libyaml-cpp-dev libgtest-dev
      - name: Configure
        run: cmake --preset host-debug
      - name: Build
        run: cmake --build --preset host-debug --parallel
      - name: Run framework example
        run: build/host-debug-make/examples/rkavp-hello-graph graphs/hello_graph.yaml
      - name: Unit and integration tests
        run: ctest --preset host-debug

  sanitizers:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libyaml-cpp-dev libgtest-dev
      - name: Configure ASan and UBSan
        run: cmake -S . -B build/sanitizers -DCMAKE_BUILD_TYPE=Debug -DRKAVP_BUILD_TESTS=ON -DRKAVP_FETCH_DEPS=OFF -DRKAVP_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build/sanitizers --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
        run: ctest --test-dir build/sanitizers --output-on-failure

  thread-sanitizer:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libyaml-cpp-dev libgtest-dev
      - name: Configure TSan
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build/tsan -DCMAKE_BUILD_TYPE=Debug -DRKAVP_BUILD_TESTS=ON -DRKAVP_FETCH_DEPS=OFF -DRKAVP_ENABLE_THREAD_SANITIZER=ON
      - name: Build and test
        run: cmake --build build/tsan --parallel && ctest --test-dir build/tsan --output-on-failure

  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libyaml-cpp-dev libgtest-dev
      - name: Configure, build, and test
        run: cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release -DRKAVP_BUILD_TESTS=ON -DRKAVP_FETCH_DEPS=OFF && cmake --build build/release --parallel && ctest --test-dir build/release --output-on-failure

  coverage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libyaml-cpp-dev libgtest-dev lcov
      - name: Configure and test with coverage
        run: |
          cmake -S . -B build/coverage -G Ninja -DCMAKE_BUILD_TYPE=Debug -DRKAVP_BUILD_TESTS=ON -DRKAVP_FETCH_DEPS=OFF -DRKAVP_ENABLE_COVERAGE=ON
          cmake --build build/coverage --parallel
          ctest --test-dir build/coverage --output-on-failure
      - name: Enforce core line coverage
        run: |
          lcov --capture --directory build/coverage --output-file build/coverage.info
          lcov --extract build/coverage.info '*/src/core/*' --output-file build/core.info
          genhtml build/core.info --output-directory build/coverage-report
          line_rate=$(lcov --summary build/core.info 2>&1 | awk '/lines......:/ {gsub("%", "", $2); print $2}')
          awk -v rate="$line_rate" 'BEGIN { if (rate + 0 < 80) { printf "core line coverage %.1f%% is below 80%%\n", rate; exit 1 } }'

  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libyaml-cpp-dev libgtest-dev pybind11-dev python3-dev python3-pytest
      - name: Configure and build
        run: cmake -S . -B build/python -DCMAKE_BUILD_TYPE=Debug -DRKAVP_BUILD_TESTS=ON -DRKAVP_FETCH_DEPS=OFF -DRKAVP_ENABLE_PYTHON=ON && cmake --build build/python --parallel
      - name: Python tests
        run: ctest --test-dir build/python -L python --output-on-failure

  docker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate deployment configuration
        run: docker/rkavp-docker validate
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ci
          push: false
          tags: rkavp:ci
